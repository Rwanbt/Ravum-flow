name: flow-ci

# Push runs on every long-lived Flow branch, so a fix is verified before a PR is
# even opened. Pull requests are verified for the whole stacked series:
#   feat/flow-mvp-0.1 -> fix/flow-foundation-proof-gates -> feat/flow-verified-foundation -> dev -> main
on:
  push:
    branches:
      - feat/flow-mvp-0.1
      - fix/flow-foundation-proof-gates
      - feat/flow-verified-foundation
  pull_request:
    branches:
      - dev
      - feat/flow-verified-foundation
      - fix/flow-foundation-proof-gates

permissions:
  contents: read

concurrency:
  group: flow-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Counting *executed* tests lets a deleted test pass silently. This step
      # counts the tests that actually ran, refuses any `ignored` test (a skip is
      # not a pass), and then requires every blocking gate to appear as
      # `... ok` by name, so removing or renaming one fails the build.
      - name: cargo test (unit + integration), executed and gated
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo test --locked --all-targets 2>&1 | tee test-output.txt
          test_status=$?
          set -e
          tr -d '\r' < test-output.txt > test-output.clean.txt
          echo "--- suites ---"
          grep -E '^(running|test result)' test-output.clean.txt || true
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' test-output.clean.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          ignored=$(grep -oE '[0-9]+ ignored' test-output.clean.txt | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "executed_passed=$passed ignored=$ignored"
          if [ "$test_status" -ne 0 ]; then
            echo "::error::cargo test failed (exit $test_status)"
            exit "$test_status"
          fi
          if [ "$ignored" -ne 0 ]; then
            echo "::error::$ignored test(s) were ignored/skipped: a skipped test is not a pass"
            exit 1
          fi
          if [ "$passed" -lt 129 ]; then
            echo "::error::expected at least 129 executed passing tests, got $passed"
            exit 1
          fi
          missing=0
          for gate in \
            p0a_selective_run_never_yields_a_publishable_receipt \
            p0a_duplicate_or_unknown_obligation_ids_are_refused \
            p0a_full_run_with_one_failing_required_obligation_is_never_publishable \
            p0a_an_optional_failing_obligation_does_not_mask_a_green_required_set \
            p0b_adding_a_required_obligation_makes_the_receipt_stale \
            p0b_changing_a_timeout_makes_the_receipt_stale \
            p0b_changing_the_policy_version_makes_the_receipt_stale \
            p0b_a_tampered_receipt_is_not_publishable \
            p0b_a_timeout_override_is_never_publishable \
            p0b_an_ambiguous_config_is_refused_not_guessed \
            p0b_explicit_ref_must_name_a_branch \
            p1_a_symbolic_ref_is_never_a_publication_target \
            p0c_corrupt_journal_is_not_reported_as_reconciled \
            p0c_duplicate_intent_id_requires_a_human \
            p0c_ref_moved_elsewhere_needs_reconciliation \
            p0c_reconcile_is_idempotent \
            p0c_status_refuses_to_guess_on_a_corrupt_journal \
            p0a_case_colliding_tree_is_refused_not_certified \
            p0a_symlink_rewritten_as_a_file_is_refused \
            p0c_one_outcome_cannot_close_two_intents \
            two_concurrent_publishes_publish_at_most_once \
            m1_two_disjoint_agents_publish_exactly_the_verified_tree \
            m2_three_agents_collision_is_diagnosed_and_resolved_explicitly \
            m3_stale_base_is_refused_and_a_rebased_proposal_succeeds \
            m6_user_files_and_index_are_preserved_through_the_whole_cycle \
            admission_is_idempotent_and_immutable \
            proposals_outside_the_trusted_surface_are_refused \
            assembly_reports_order_and_stays_deterministic \
            publish_dry_run_plans_without_mutating_anything \
            publishing_a_candidate_requires_a_verified_receipt \
            binary_and_mode_changes_survive_the_cycle \
            eight_concurrent_publishes_publish_at_most_once \
            a_live_old_lock_is_never_stolen \
            an_unparseable_lock_is_refused_and_preserved \
            a_dead_owners_lock_is_recovered \
            obligation_stdout_is_bounded_through_the_cli \
            nonblocking_hooks_are_dispatched_by_run_and_publish \
            blocking_post_checkout_makes_run_refuse_the_scratch \
            blocking_reference_transaction_aborts_publish_without_moving_the_ref \
            hijacked_git_environment_does_not_redirect_the_cli \
            missing_toolchain_is_unsupported_and_never_publishable ; do
            if ! grep -qE "^test ${gate} \.\.\. ok$" test-output.clean.txt; then
              echo "::error::required gate '$gate' did not run or did not pass"
              missing=1
            fi
          done
          exit $missing

      - name: build release
        run: cargo build --locked --release

      - name: harness self-tests (R0-a)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s experiments/r0a/tests -v

      - name: keep the test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-test-output-${{ matrix.os }}
          path: test-output.txt
          if-no-files-found: warn

  # The polyglot demo is the "a reader can reproduce it" gate: three real
  # toolchains, offline, with a green run, a real publication, and a red edit that
  # must be refused. It is a separate job so a fixture failure is unambiguous.
  polyglot:
    name: polyglot ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: polyglot demo (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash examples/polyglot/run-demo.sh all

      - name: polyglot demo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File examples/polyglot/run-demo.ps1 -Fixture all
